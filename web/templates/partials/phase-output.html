{{define "phase-output"}}<section id="phase-output" class="card card-border bg-base-100"{{if .Run.CanStop}} hx-get="/runs/{{.Run.ID}}/output" hx-trigger="every 2s" hx-target="this" hx-swap="outerHTML" hx-sync="this:queue last"{{end}}><div class="card-body"><h2 class="card-title">Phase output</h2><p class="text-sm text-base-content/70">{{.LogMessage}}</p><pre class="max-h-[36rem] overflow-auto rounded-box bg-base-200 p-4 text-xs leading-relaxed" tabindex="0">{{if .Log}}{{.Log}}{{else}}No readable output yet.{{end}}</pre></div></section>{{end}}
