{{define "verification"}}<h3 class="font-semibold">Verification evidence</h3>
{{range .Verification}}<article class="alert {{outcomeAlert .Outcome}}"><div class="min-w-0 space-y-2"><h4 class="font-semibold"><code>{{.Command}}</code> · {{.Outcome}}</h4>{{if .Excerpt}}<pre>{{.Excerpt}}</pre>{{end}}</div></article>{{else}}{{if .HasVerification}}<p>no verification reported</p>{{else}}<p>Verification was not recorded by this schema version.</p>{{end}}{{end}}{{end}}
