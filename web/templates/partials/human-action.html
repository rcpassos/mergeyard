{{define "human-action"}}{{if .}}<section class="alert alert-error human-action"><div class="space-y-2"><h2 class="font-semibold">Human action required</h2><p>{{.Decision}}</p>{{if .Files}}<h3 class="font-semibold">Files to inspect</h3><ul class="list-disc pl-5">{{range .Files}}<li><code>{{.}}</code></li>{{end}}</ul>{{end}}{{if .Options}}<h3 class="font-semibold">Options</h3><ul class="list-disc pl-5">{{range .Options}}<li>{{.}}</li>{{end}}</ul>{{end}}</div></section>{{end}}{{end}}
