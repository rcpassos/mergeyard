<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Mergeyard — Give your issues a way forward.</title>
  <desc id="description">Local coding agents take a ready GitHub issue through implementation, independent review, and CI checks. The final merge decision stays with you.</desc>
  <rect width="1200" height="630" fill="#edf3f8"/>
  <g font-family="Avenir Next, Avenir, Segoe UI, sans-serif" fill="#193b4d">
    <g transform="translate(62 62)" fill="none" stroke="#1769e8" stroke-width="3.5" stroke-linecap="round">
