<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Mergeyard — Give your issues a way forward.</title>
  <desc id="description">Local coding agents take a ready GitHub issue through implementation, independent review, and CI checks. The final merge decision stays with you.</desc>
