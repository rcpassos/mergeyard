      <circle cx="7" cy="4" r="4" fill="#edf3f8"/>
      <circle cx="32" cy="4" r="4" fill="#edf3f8"/>
      <circle cx="7" cy="37" r="4" fill="#edf3f8"/>
      <circle cx="32" cy="37" r="4" fill="#edf3f8"/>
    </g>
    <text x="112" y="94" font-size="34" font-weight="700" letter-spacing="-1.2">Mergeyard</text>
    <text x="64" y="242" font-size="68" font-weight="650" letter-spacing="-3.6">Give your issues</text>
    <text x="64" y="318" font-size="68" font-weight="650" letter-spacing="-3.6">a way forward.</text>
    <text x="66" y="388" font-size="24" fill="#536b7a">Local coding agents. Independent review.</text>
    <text x="66" y="424" font-size="24" fill="#536b7a">You decide what merges.</text>
    <text x="66" y="548" font-size="19" fill="#536b7a">Works with Claude Code and Codex</text>
