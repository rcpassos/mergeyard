name: Set up Go with module and build caches
description: Reuse dependencies and refresh compiled outputs for each commit.

inputs:
  cache-scope:
    description: Separate test and build cache entries.
    required: false
    default: build
  cache:
    description: Restore and save Go module and build caches.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Read pinned Go toolchain
      id: toolchain
      shell: bash
      run: echo "version=$(awk '/^toolchain / {sub(/^go/, "", $2); print $2}' go.mod)" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      id: go
      with:
        go-version: ${{ steps.toolchain.outputs.version }}
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    - name: Cache Go modules
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache Go build outputs
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-scope }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-scope }}-${{ hashFiles('go.sum') }}-
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-scope }}-
