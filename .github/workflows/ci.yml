name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-tests:
    name: Go tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: tests
      - name: Install tmux for session integration tests
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Check test environment
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_preflight.py
      - name: Test
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_shard.py --shard ${{ matrix.shard }} --total 4 ./...

  checks:
    name: Lint, Python tests, and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install tmux for preflight smoke tests
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Lint
        run: make lint
      - name: Check reachable vulnerabilities
        run: make vulncheck
      - name: Python tests
        run: make test-python
      - name: Build
        run: make build
      - name: Check committed dashboard and website theme assets
        run: git diff --exit-code -- web/static site/theme.css site/favicon.svg
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean

  # Preserve the required check name and fail if any shard or build check fails.
  test:
    needs: [go-tests, checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          GO_TEST_RESULT: ${{ needs.go-tests.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$GO_TEST_RESULT" = success
          test "$CHECKS_RESULT" = success
