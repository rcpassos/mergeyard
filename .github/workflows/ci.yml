name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install tmux for session integration tests
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
